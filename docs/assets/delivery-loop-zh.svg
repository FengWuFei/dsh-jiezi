<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">芥子小程序交付闭环</title>
  <desc id="desc">从一句需求到 Native Shell TSX 源码、不可变 Release、配对设备与真机验证，再通过诊断证据返回源码修复。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#98A2B3"/>
    </marker>
    <style>
      .eyebrow { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; fill: #3D57D6; }
      .topnote { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .card { fill: #F8F9FC; stroke: #D9DEE8; stroke-width: 1.2; }
      .step { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 1.4px; fill: #3D57D6; }
      .title { font: 650 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .subtitle { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; }
      .meta { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: .8px; fill: #98A2B3; }
      .flow { fill: none; stroke: #98A2B3; stroke-width: 1.5; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #6E8CFF; stroke-width: 1.5; marker-end: url(#arrow); }
      .loop-label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: .4px; fill: #3D57D6; }
    </style>
  </defs>

  <text x="36" y="28" class="eyebrow">从需求到真机验证</text>
  <text x="1164" y="28" text-anchor="end" class="topnote">构建 → 交付 → 观察 → 修复</text>

  <rect x="36" y="58" width="200" height="116" rx="14" class="card"/>
  <path d="M54 58 H88" stroke="#6E8CFF" stroke-width="3" stroke-linecap="round"/>
  <text x="54" y="84" class="step">01 · IDEA</text>
  <text x="54" y="117" class="title">一句需求</text>
  <text x="54" y="141" class="subtitle">定义目标与验收路径</text>
  <text x="54" y="160" class="meta">DEFINE THE FLOW</text>

  <path d="M242 116 H260" class="flow"/>

  <rect x="268" y="58" width="200" height="116" rx="14" class="card"/>
  <path d="M286 58 H320" stroke="#6E8CFF" stroke-width="3" stroke-linecap="round"/>
  <text x="286" y="84" class="step">02 · SOURCE</text>
  <text x="286" y="117" class="title">Native Shell TSX</text>
  <text x="286" y="141" class="subtitle">初始化 · 编码 · 测试</text>
  <text x="286" y="160" class="meta">INIT · EDIT</text>

  <path d="M474 116 H492" class="flow"/>

  <rect x="500" y="58" width="200" height="116" rx="14" class="card"/>
  <path d="M518 58 H552" stroke="#3D57D6" stroke-width="3" stroke-linecap="round"/>
  <text x="518" y="84" class="step">03 · RELEASE</text>
  <text x="518" y="117" class="title">不可变 Release</text>
  <text x="518" y="141" class="subtitle">构建 · 签名 · SHA-256</text>
  <text x="518" y="160" class="meta">ONE EXACT ARTIFACT</text>

  <path d="M706 116 H724" class="flow"/>

  <rect x="732" y="58" width="200" height="116" rx="14" class="card"/>
  <path d="M750 58 H784" stroke="#6E8CFF" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="84" class="step">04 · DEVICE</text>
  <text x="750" y="117" class="title">配对设备</text>
  <text x="750" y="141" class="subtitle">安装 · 启动 · 状态回传</text>
  <text x="750" y="160" class="meta">PAIRED IPHONE</text>

  <path d="M938 116 H956" class="flow"/>

  <rect x="964" y="58" width="200" height="116" rx="14" class="card"/>
  <path d="M982 58 H1016" stroke="#3D57D6" stroke-width="3" stroke-linecap="round"/>
  <text x="982" y="84" class="step">05 · VERIFY</text>
  <text x="982" y="117" class="title">真机验证</text>
  <text x="982" y="141" class="subtitle">界面 · 操作 · 断言</text>
  <text x="982" y="160" class="meta">SCREEN · DIAGNOSTICS</text>

  <path d="M1064 174 V204 Q1064 222 1046 222 H386 Q368 222 368 204 V181" class="loop"/>
  <text x="716" y="253" text-anchor="middle" class="loop-label">miniapp diagnostics · 真实证据驱动修复</text>
</svg>
