name: Release

# Pushing a `v*` tag is the only way to release:
#
#   npm version patch|minor|major
#   git push --follow-tags
#
# The job fails unless the tag equals the package version, so a tag can never
# ship a different build than the one in the repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --omit=optional
      - name: Verify the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          }
      - run: npm run typecheck
      - run: npm test
      # Trusted publishing: GitHub's OIDC token authorizes this exact repository
      # and workflow on npm, so the repository stores no long-lived npm token.
      # Requires npm >= 11.5 and a configured trusted publisher on npmjs.com.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-jiezi@${version}" version >/dev/null 2>&1; then
            echo "dsh-jiezi@${version} is already published; skipping"
          else
            npm publish --access public
          fi
      - name: Update index.json from npm
        run: npm run index
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json already matches npm"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m "chore: index ${GITHUB_REF_NAME}"
          git push origin HEAD:main
      - name: Pack the offline tarball
        run: npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
