name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The optional toolchain package is 71 MB and is not needed by unit tests;
      # tests that require nsh skip themselves when it is absent.
      - run: npm ci --omit=optional
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
      - name: Test the vendored bridge
        run: |
          set -o pipefail
          # Two integration tests drive a real signed build and need the pinned
          # nsh toolchain; without it the bridge answers build_failed by design,
          # so a Linux runner skips exactly those two.
          node --test --test-skip-pattern='QR pairing sessions|bridge pairs a device' \
            vendor/bridge/test/*.test.js 2>&1 | tee /tmp/bridge-test.log
      # The Actions log needs an authenticated download; the job summary keeps
      # the failing assertions readable right on the run page.
      - name: Show failing assertions
        if: failure()
        run: |
          for log in /tmp/test.log /tmp/bridge-test.log; do
            [ -f "$log" ] || continue
            echo "### $(basename "$log")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^not ok|^# |AssertionError|Error:|expected|actual' "$log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
